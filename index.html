<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crocodile Jump</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #d4f7b8;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #score {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            font-size: 52px;
            font-weight: bold;
            color: #222;
            pointer-events: none;
            z-index: 10;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            z-index: 20;
            width: 80%;
            max-width: 320px;
        }
        button {
            background: #76c838;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            width: 100%;
        }
    </style>
</head>
<body>

<div id="score">0</div>
<div id="game-over">
    <h2 style="margin-top:0;">Игра окончена!</h2>
    <p id="final-score" style="font-size:20px;">Счёт: 0</p>
    <button onclick="resetGame()">Играть снова</button>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreElement = document.getElementById('final-score');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    let score = 0;
    let isGameOver = false;

    const player = {
        x: width / 2 - 25,
        y: height - 150,
        radius: 25,
        vx: 0,
        vy: 0,
        gravity: 0.4,
        jumpPower: -12
    };

    let platforms = [];
    const platformCount = 8;
    const platformWidth = 85;
    const platformHeight = 18;

    function createPlatforms() {
        platforms = [];
        platforms.push({
            x: width / 2 - platformWidth / 2,
            y: height - 80,
            width: platformWidth,
            height: platformHeight
        });

        for (let i = 1; i < platformCount; i++) {
            platforms.push({
                x: Math.random() * (width - platformWidth),
                y: height - (i * (height / platformCount)) - 80,
                width: platformWidth,
                height: platformHeight
            });
        }
    }

    function drawCrocodile(p) {
        ctx.fillStyle = '#76c838';
        ctx.strokeStyle = '#1a2e0d';
        ctx.lineWidth = 2;

        // Универсальная отрисовка скруглённого прямоугольника (работает во всех браузерах)
        ctx.beginPath();
        const r = 8;
        ctx.moveTo(p.x + r, p.y);
        ctx.lineTo(p.x + p.width - r, p.y);
        ctx.quadraticCurveTo(p.x + p.width, p.y, p.x + p.width, p.y + r);
        ctx.lineTo(p.x + p.width, p.y + p.height - r);
        ctx.quadraticCurveTo(p.x + p.width, p.y + p.height, p.x + p.width - r, p.y + p.height);
        ctx.lineTo(p.x + r, p.y + p.height);
        ctx.quadraticCurveTo(p.x, p.y + p.height, p.x, p.y + p.height - r);
        ctx.lineTo(p.x, p.y + r);
        ctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Глаз крокодила
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x + 25, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(p.x + 25, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawPlayer() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.x + player.radius, player.y + player.radius, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#222';
        ctx.stroke();

        ctx.fillStyle = '#222';
        ctx.font = '26px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('👽', player.x + player.radius, player.y + player.radius + 2);
        ctx.restore();
    }

    window.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
            const touchX = e.touches[0].clientX;
            player.vx = touchX < width / 2 ? -6 : 6;
        }
    });

    window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
            const touchX = e.touches[0].clientX;
            player.vx = touchX < width / 2 ? -6 : 6;
        }
    });

    window.addEventListener('touchend', () => {
        player.vx = 0;
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') player.vx = -6;
        if (e.key === 'ArrowRight') player.vx = 6;
    });

    window.addEventListener('keyup', () => {
        player.vx = 0;
    });

    function update() {
        if (isGameOver) return;

        ctx.clearRect(0, 0, width, height);

        player.x += player.vx;
        player.vy += player.gravity;
        player.y += player.vy;

        if (player.x + player.radius * 2 < 0) player.x = width;
        if (player.x > width) player.x = -player.radius * 2;

        if (player.y < height / 2 && player.vy < 0) {
            player.y = height / 2;
            platforms.forEach(p => {
                p.y -= player.vy;
                if (p.y > height) {
                    p.y = 0;
                    p.x = Math.random() * (width - platformWidth);
                    score += 10;
                    scoreElement.innerText = score;
                }
            });
        }

        platforms.forEach(p => {
            drawCrocodile(p);
            if (
                player.vy > 0 &&
                player.x + player.radius * 1.5 > p.x &&
                player.x + player.radius * 0.5 < p.x + p.width &&
                player.y + player.radius * 2 >= p.y &&
                player.y + player.radius * 2 <= p.y + p.height + 12
            ) {
                player.vy = player.jumpPower;
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }
        });

        drawPlayer();

        if (player.y > height) {
            isGameOver = true;
            finalScoreElement.innerText = `Счёт: ${score}`;
            gameOverScreen.style.display = 'block';
        }

        requestAnimationFrame(update);
    }

    function resetGame() {
        score = 0;
        scoreElement.innerText = score;
        isGameOver = false;
        gameOverScreen.style.display = 'none';
        player.x = width / 2 - 25;
        player.y = height - 150;
        player.vy = 0;
        player.vx = 0;
        createPlatforms();
        update();
    }

    createPlatforms();
    update();
</script>
</body>
</html>
