<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crocodile Jump</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{margin:0;padding:0;overflow:hidden;background:#d4f7b8;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#score{position:absolute;top:25px;width:100%;text-align:center;font-size:52px;font-weight:bold;color:#222;pointer-events:none;z-index:10}
#game-over{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.95);padding:30px 40px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.25);z-index:20;width:80%;max-width:320px}
button{background:#76c838;color:#fff;border:none;padding:15px 30px;font-size:20px;border-radius:12px;cursor:pointer;margin-top:15px;font-weight:bold;width:100%}
</style>
</head>
<body>
<div id="score">0</div>
<div id="game-over">
<h2 style="margin-top:0">Игра окончена!</h2>
<p id="final-score" style="font-size:20px">Счёт: 0</p>
<button onclick="resetGame()">Играть снова</button>
</div>
<canvas id="gameCanvas"></canvas>
<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){tg.ready();tg.expand()}
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),overEl=document.getElementById('game-over'),finalEl=document.getElementById('final-score');
let width=canvas.width=window.innerWidth,height=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight});
let score=0,isGameOver=false;
const MOVE_SPEED=3.2;
const player={x:width/2-25,y:height-150,radius:25,vx:0,vy:0,gravity:0.38,jumpPower:-11.5,jetpackTimer:0};
let platforms=[];
const pCount=8,pW=85,pH=18;
function genPlatform(yPos,isStart){
let type='normal',hasHeli=false;
if(!isStart){
const r=Math.random();
if(score>300&&r<0.2)type='moving';
else if(r<0.45)type='single';
if(type==='normal'&&Math.random()<0.1)hasHeli=true;
}
return{x:isStart?(width/2-pW/2):Math.random()*(width-pW),y:yPos,width:pW,height:pH,type:type,vx:type==='moving'?(Math.random()<0.5?2:-2):0,hasHeli:hasHeli,broken:false};
}
function createPlatforms(){
platforms=[genPlatform(height-80,true)];
for(let i=1;i<pCount;i++)platforms.push(genPlatform(height-(i*(height/pCount))-80,false));
}
function drawHeli(x,y,spin){
ctx.save();ctx.fillStyle='#ff5722';ctx.beginPath();ctx.arc(x,y,8,Math.PI,0);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.stroke();
ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x,y-14);ctx.stroke();
const bw=spin?(Math.sin(Date.now()*0.05)*18):16;
ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-bw,y-14);ctx.lineTo(x+bw,y-14);ctx.stroke();ctx.restore();
}
function drawCroc(p){
if(p.broken)return;
ctx.fillStyle=p.type==='single'?'#f5f5f5':(p.type==='moving'?'#4fc3f7':'#76c838');
ctx.strokeStyle='#1a2e0d';ctx.lineWidth=2;ctx.beginPath();
const r=8;
ctx.moveTo(p.x+r,p.y);ctx.lineTo(p.x+p.width-r,p.y);ctx.quadraticCurveTo(p.x+p.width,p.y,p.x+p.width,p.y+r);
ctx.lineTo(p.x+p.width,p.y+p.height-r);ctx.quadraticCurveTo(p.x+p.width,p.y+p.height,p.x+p.width-r,p.y+p.height);
ctx.lineTo(p.x+r,p.y+p.height);ctx.quadraticCurveTo(p.x,p.y+p.height,p.x,p.y+p.height-r);
ctx.lineTo(p.x,p.y+r);ctx.quadraticCurveTo(p.x,p.y,p.x+r,p.y);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x+25,p.y,6,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p.x+25,p.y,2,0,Math.PI*2);ctx.fill();
if(p.hasHeli)drawHeli(p.x+p.width/2,p.y,false);
}
function drawPlayer(){
ctx.save();const cx=player.x+player.radius,cy=player.y+player.radius;
ctx.beginPath();ctx.arc(cx,cy,player.radius,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#222';ctx.stroke();
ctx.fillStyle='#222';ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('👽',cx,cy+2);
if(player.jetpackTimer>0)drawHeli(cx,player.y,true);
ctx.restore();
}
window.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length>0)player.vx=e.touches.clientX<width/2?-MOVE_SPEED:MOVE_SPEED});
window.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>0)player.vx=e.touches.clientX<width/2?-MOVE_SPEED:MOVE_SPEED});
window.addEventListener('touchend',()=>{player.vx=0});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')player.vx=-MOVE_SPEED;if(e.key==='ArrowRight')player.vx=MOVE_SPEED});
window.addEventListener('keyup',()=>{player.vx=0});
function update(){
if(isGameOver)return;
ctx.clearRect(0,0,width,height);
if(player.jetpackTimer>0){player.jetpackTimer--;player.vy=-14}else{player.vy+=player.gravity}
player.x+=player.vx;player.y+=player.vy;
const cx=player.x+player.radius;
if(cx<0)player.x=width-player.radius;else if(cx>width)player.x=-player.radius;
if(player.y<height/2&&player.vy<0){
player.y=height/2;
platforms.forEach((p,idx)=>{
p.y-=player.vy;
if(p.y>height){platforms[idx]=genPlatform(0,false);score+=10;scoreEl.innerText=score}
});
}
platforms.forEach(p=>{
if(p.type==='moving'&&!p.broken){p.x+=p.vx;if(p.x<=0||p.x+p.width>=width)p.vx*=-1}
drawCroc(p);
if(!p.broken&&player.jetpackTimer<=0&&player.vy>0&&player.x+player.radius*1.5>p.x&&player.x+player.radius*0.5<p.x+p.width&&player.y+player.radius*2>=p.y&&player.y+player.radius*2<=p.y+p.height+12){
if(p.hasHeli){p.hasHeli=false;player.jetpackTimer=150;if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success')}
else{player.vy=player.jumpPower;if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light')}
if(p.type==='single')p.broken=true;
}
});
drawPlayer();
if(player.y>height){isGameOver=true;finalEl.innerText='Счёт: '+score;overEl.style.display='block'}
requestAnimationFrame(update);
}
function resetGame(){
score=0;scoreEl.innerText=score;isGameOver=false;overEl.style.display='none';
player.x=width/2-25;player.y=height-150;player.vy=0;player.vx=0;player.jetpackTimer=0;
createPlatforms();update();
}
createPlatforms();update();
</script>
</body>
</html>
