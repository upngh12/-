
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crocodile Jump</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{margin:0;padding:0;overflow:hidden;background:#d4f7b8;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#score{position:absolute;top:25px;width:100%;text-align:center;font-size:52px;font-weight:bold;color:#222;pointer-events:none;z-index:10;text-shadow:0 2px 0 rgba(255,255,255,0.6)}
#game-over{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.95);padding:30px 40px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.25);z-index:20;width:80%;max-width:320px}
button{background:#76c838;color:#fff;border:none;padding:15px 30px;font-size:20px;border-radius:12px;cursor:pointer;margin-top:15px;font-weight:bold;width:100%}
</style>
</head>
<body>
<div id="score">0</div>
<div id="game-over">
<h2 style="margin-top:0">Игра окончена!</h2>
<p id="final-score" style="font-size:20px">Счёт: 0</p>
<button onclick="resetGame()">Играть снова</button>
</div>
<canvas id="gameCanvas"></canvas>
<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){tg.ready();tg.expand()}
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),overEl=document.getElementById('game-over'),finalEl=document.getElementById('final-score');
let width=canvas.width=window.innerWidth,height=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight});
let score=0,isGameOver=false;
const TOUCH_SENS=1.15,KEY_SPEED=4.5;
const player={x:width/2-25,y:height-150,radius:25,vx:0,vy:0,gravity:0.38,jumpPower:-11.5,jetpackTimer:0};
let platforms=[],brokenPieces=[],lastTouchX=null;
const pCount=8,pW=90,pH=20;

function genPlatform(yPos,isStart){
let type='normal',hasHeli=false;
if(!isStart){
const r=Math.random();
if(score>300&&r<0.2)type='moving';
else if(r<0.45)type='single';
if(type==='normal'&&Math.random()<0.25)hasHeli=true;
}
return{x:isStart?(width/2-pW/2):Math.random()*(width-pW),y:yPos,width:pW,height:pH,type:type,vx:type==='moving'?(Math.random()<0.5?2:-2):0,hasHeli:hasHeli,broken:false};
}

function createPlatforms(){
platforms=[genPlatform(height-80,true)];
brokenPieces=[];
for(let i=1;i<pCount;i++)platforms.push(genPlatform(height-(i*(height/pCount))-80,false));
}

function drawHeli(x,y,spin){
ctx.save();
ctx.fillStyle='#ff3d00';ctx.beginPath();ctx.arc(x,y,11,Math.PI,0);ctx.fill();ctx.strokeStyle='#1a2e0d';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(x,y-3,4,Math.PI,0);ctx.fill();
ctx.beginPath();ctx.moveTo(x,y-11);ctx.lineTo(x,y-19);ctx.stroke();
const bw=spin?(Math.sin(Date.now()*0.06)*24):22;
ctx.strokeStyle='#222';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-bw,y-19);ctx.lineTo(x+bw,y-19);ctx.stroke();
ctx.restore();
}

function drawRoundRect(x,y,w,h,r){
ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawCroc(p){
if(p.broken)return;
ctx.save();
const grad=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.height);
if(p.type==='moving'){grad.addColorStop(0,'#4fc3f7');grad.addColorStop(1,'#0288d1')}
else if(p.type==='single'){grad.addColorStop(0,'#9ccc65');grad.addColorStop(1,'#689f38')}
else{grad.addColorStop(0,'#8bc34a');grad.addColorStop(1,'#558b2f')}

ctx.fillStyle=grad;ctx.strokeStyle='#1b3009';ctx.lineWidth=2.5;
drawRoundRect(p.x,p.y,p.width,p.height,9);ctx.fill();ctx.stroke();

ctx.fillStyle='rgba(255,255,255,0.3)';
drawRoundRect(p.x+4,p.y+2,p.width-8,5,3);ctx.fill();

ctx.fillStyle='#2e4d12';
for(let sx=p.x+42;sx<p.x+p.width-12;sx+=12){ctx.beginPath();ctx.arc(sx,p.y+3,2.5,0,Math.PI*2);ctx.fill()}

ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x+24,p.y,7,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p.x+25,p.y,2.8,0,Math.PI*2);ctx.fill();

ctx.strokeStyle='#1b3009';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x+2,p.y+12);ctx.lineTo(p.x+22,p.y+12);ctx.stroke();
ctx.fillStyle='#fff';
for(let tx=p.x+6;tx<=p.x+18;tx+=6){ctx.beginPath();ctx.moveTo(tx,p.y+12);ctx.lineTo(tx+2,p.y+16);ctx.lineTo(tx+4,p.y+12);ctx.fill()}

if(p.type==='single'){
ctx.strokeStyle='#1b3009';ctx.lineWidth=2.5;ctx.beginPath();
const mx=p.x+p.width/2;
ctx.moveTo(mx-2,p.y);ctx.lineTo(mx+4,p.y+6);ctx.lineTo(mx-4,p.y+13);ctx.lineTo(mx+2,p.y+p.height);
ctx.stroke();
}
ctx.restore();
if(p.hasHeli)drawHeli(p.x+p.width/2,p.y,false);
}

function drawPlayer(){
ctx.save();const cx=player.x+player.radius,cy=player.y+player.radius;
ctx.beginPath();ctx.arc(cx,cy,player.radius,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#222';ctx.stroke();
ctx.fillStyle='#222';ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('👽',cx,cy+2);
if(player.jetpackTimer>0)drawHeli(cx,player.y,true);
ctx.restore();
}

function clampPlayerX(){
if(player.x<0)player.x=0;
if(player.x+player.radius*2>width)player.x=width-player.radius*2;
}

window.addEventListener('touchstart',e=>{
if(e.touches&&e.touches.length>0)lastTouchX=e.touches[0].clientX;
});
window.addEventListener('touchmove',e=>{
if(e.touches&&e.touches.length>0&&lastTouchX!==null){
const currentX=e.touches[0].clientX;
const deltaX=currentX-lastTouchX;
player.x+=deltaX*TOUCH_SENS;
clampPlayerX();
lastTouchX=currentX;
}
});
window.addEventListener('touchend',()=>{lastTouchX=null});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')player.vx=-KEY_SPEED;if(e.key==='ArrowRight')player.vx=KEY_SPEED});
window.addEventListener('keyup',()=>{player.vx=0});

function update(){
if(isGameOver)return;
ctx.clearRect(0,0,width,height);
if(player.jetpackTimer>0){player.jetpackTimer--;player.vy=-14}else{player.vy+=player.gravity}
player.x+=player.vx;player.y+=player.vy;
clampPlayerX();

if(player.y<height/2&&player.vy<0){
player.y=height/2;
platforms.forEach((p,idx)=>{
p.y-=player.vy;
if(p.y>height){platforms[idx]=genPlatform(0,false);score+=10;scoreEl.innerText=score}
});
brokenPieces.forEach(bp=>bp.y-=player.vy);
}

for(let i=brokenPieces.length-1;i>=0;i--){
const bp=brokenPieces[i];
bp.x+=bp.vx;bp.vy+=0.4;bp.y+=bp.vy;bp.rot+=bp.vrot;
ctx.save();ctx.translate(bp.x+bp.w/2,bp.y+bp.h/2);ctx.rotate(bp.rot);
ctx.fillStyle='#7cb342';ctx.strokeStyle='#1b3009';ctx.lineWidth=2;
drawRoundRect(-bp.w/2,-bp.h/2,bp.w,bp.h,6);ctx.fill();ctx.stroke();ctx.restore();
if(bp.y>height+50)brokenPieces.splice(i,1);
}

platforms.forEach(p=>{
if(p.type==='moving'&&!p.broken){p.x+=p.vx;if(p.x<=0||p.x+p.width>=width)p.vx*=-1}
drawCroc(p);
if(!p.broken&&player.jetpackTimer<=0&&player.vy>0&&player.x+player.radius*1.5>p.x&&player.x+player.radius*0.5<p.x+p.width&&player.y+player.radius*2>=p.y&&player.y+player.radius*2<=p.y+p.height+12){
if(p.hasHeli){p.hasHeli=false;player.jetpackTimer=150;if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success')}
else{player.vy=player.jumpPower;if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light')}
if(p.type==='single'){
p.broken=true;
brokenPieces.push({x:p.x,y:p.y,w:p.width/2,h:p.height,vx:-1.5,vy:1,rot:0,vrot:-0.05});
brokenPieces.push({x:p.x+p.width/2,y:p.y,w:p.width/2,h:p.height,vx:1.5,vy:1,rot:0,vrot:0.05});
}
}
});

drawPlayer();
if(player.y>height){isGameOver=true;finalEl.innerText='Счёт: '+score;overEl.style.display='block'}
requestAnimationFrame(update);
}

function resetGame(){
score=0;scoreEl.innerText=score;isGameOver=false;overEl.style.display='none';
player.x=width/2-25;player.y=height-150;player.vy=0;player.vx=0;player.jetpackTimer=0;lastTouchX=null;
createPlatforms();update();
}
createPlatforms();update();
</script>
</body>
</html>
