<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crocodile Jump</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{margin:0;overflow:hidden;background:#d4f7b8;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#s{position:absolute;top:25px;width:100%;text-align:center;font-size:52px;font-weight:700;color:#222;pointer-events:none;z-index:10}
#go{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);padding:30px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;width:80%;max-width:300px}
button{background:#76c838;color:#fff;border:none;padding:15px;font-size:20px;border-radius:12px;margin-top:15px;font-weight:700;width:100%}
</style>
</head>
<body>
<div id="s">0</div>
<div id="go"><h2 style="margin:0">Игра окончена!</h2><p id="fs" style="font-size:20px">Счёт: 0</p><button onclick="rst()">Играть снова</button></div>
<canvas id="c"></canvas>
<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){tg.ready();tg.expand()}
const c=document.getElementById('c'),x=c.getContext('2d'),sEl=document.getElementById('s'),goEl=document.getElementById('go'),fsEl=document.getElementById('fs');
let W=c.width=innerWidth,H=c.height=innerHeight;
onresize=()=>{W=c.width=innerWidth;H=c.height=innerHeight};
let sc=0,over=0,pls=[],bps=[],fsh=[],ltx=null;
const p={x:W/2-25,y:H-150,r:25,vx:0,vy:0,g:.38,jp:-11.5,jt:0},pW=90,pH=20;

function diff(){return Math.min(sc/3000,1)}
function gen(y,st){
let t='n',h=0,d=diff();
if(!st){
let r=Math.random(),mc=.28+d*.25,sc2=mc+.25+d*.15;
if(r<mc)t='m';else if(r<sc2)t='s';
if(t==='n'&&Math.random()<(.22-d*.1))h=1;
if(sc>=150&&Math.random()<(.12+d*.18))fsh.push({x:Math.random()*(W-70)+35,y:y-35,r:20,vx:(Math.random()<.5?1:-1)*(1.2+d*2.5)});
}
return{x:st?(W/2-pW/2):Math.random()*(W-pW),y:y,w:pW,h:pH,t:t,vx:t==='m'?(2.2+d*2.5)*(Math.random()<.5?1:-1):0,h:h,b:0};
}
function init(){pls=[gen(H-80,1)];bps=[];fsh=[];for(let i=1;i<8;i++)pls.push(gen(H-i*(H/8)-80,0))}
function dHeli(hx,hy,sp){
x.save();x.fillStyle='#ff3d00';x.beginPath();x.arc(hx,hy,11,Math.PI,0);x.fill();x.strokeStyle='#1a2e0d';x.lineWidth=2;x.stroke();
x.fillStyle='#ffeb3b';x.beginPath();x.arc(hx,hy-3,4,Math.PI,0);x.fill();x.beginPath();x.moveTo(hx,hy-11);x.lineTo(hx,hy-19);x.stroke();
let bw=sp?Math.sin(Date.now()*.06)*24:22;x.strokeStyle='#222';x.lineWidth=4;x.beginPath();x.moveTo(hx-bw,hy-19);x.lineTo(hx+bw,hy-19);x.stroke();x.restore();
}
function dFish(f){
x.save();x.translate(f.x,f.y);if(f.vx>0)x.scale(-1,1);
x.fillStyle='#fff';x.strokeStyle='#111';x.lineWidth=2.5;x.lineJoin='round';
x.beginPath();x.moveTo(-26,0);x.quadraticCurveTo(-18,-8,-10,-5);x.lineTo(-10,5);x.quadraticCurveTo(-18,8,-26,0);x.closePath();x.fill();x.stroke();
x.fillStyle='#111';x.beginPath();x.arc(-18,-1,2,0,7);x.fill();
x.beginPath();x.moveTo(-10,0);x.lineTo(18,0);x.stroke();
for(let i=-6;i<=12;i+=4.5){x.beginPath();x.moveTo(i,-7);x.lineTo(i,5);x.stroke()}
x.fillStyle='#fff';x.beginPath();x.moveTo(18,0);x.lineTo(27,-7);x.lineTo(24,0);x.lineTo(27,7);x.closePath();x.fill();x.stroke();
x.restore();
}
function dCroc(o){
if(o.b)return;x.save();
x.fillStyle=o.t==='m'?'#29b6f6':(o.t==='s'?'#9ccc65':'#76c838');
x.strokeStyle='#1b3009';x.lineWidth=2.5;
x.fillRect(o.x+3,o.y+2,o.w-6,o.h-4);
x.strokeRect(o.x+2,o.y+1,o.w-4,o.h-2);
x.fillStyle='rgba(255,255,255,.35)';x.fillRect(o.x+4,o.y+3,o.w-8,4);
x.fillStyle='#2e4d12';for(let sx=o.x+42;sx<o.x+o.w-12;sx+=12){x.beginPath();x.arc(sx,o.y+2,2.5,0,7);x.fill()}
x.fillStyle='#fff';x.beginPath();x.arc(o.x+24,o.y,7,0,7);x.fill();x.stroke();
x.fillStyle='#000';x.beginPath();x.arc(o.x+25,o.y,2.8,0,7);x.fill();
x.strokeStyle='#1b3009';x.lineWidth=1.5;x.beginPath();x.moveTo(o.x+2,o.y+12);x.lineTo(o.x+22,o.y+12);x.stroke();
x.fillStyle='#fff';for(let tx=o.x+6;tx<=o.x+18;tx+=6){x.beginPath();x.moveTo(tx,o.y+12);x.lineTo(tx+2,o.y+16);x.lineTo(tx+4,o.y+12);x.fill()}
if(o.t==='s'){x.strokeStyle='#1b3009';x.lineWidth=2.5;x.beginPath();let m=o.x+o.w/2;x.moveTo(m-2,o.y);x.lineTo(m+4,o.y+6);x.lineTo(m-4,o.y+13);x.lineTo(m+2,o.y+o.h);x.stroke()}
x.restore();if(o.h)dHeli(o.x+o.w/2,o.y,0);
}
function clamp(){if(p.x<0)p.x=0;if(p.x+p.r*2>W)p.x=W-p.r*2}
ontouchstart=e=>{if(e.touches&&e.touches.length)ltx=e.touches.clientX};
ontouchmove=e=>{if(e.touches&&e.touches.length&&ltx!==null){p.x+=(e.touches.clientX-ltx)*1.15;clamp();ltx=e.touches.clientX}};
ontouchend=()=>{ltx=null};
onkeydown=e=>{if(e.key==='ArrowLeft')p.vx=-4.5;if(e.key==='ArrowRight')p.vx=4.5};
onkeyup=()=>{p.vx=0};

function die(){over=1;if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('error');fsEl.innerText='Счёт: '+sc;goEl.style.display='block'}
function loop(){
if(over)return;x.clearRect(0,0,W,H);
if(p.jt>0){p.jt--;p.vy=-14}else p.vy+=p.g;
p.x+=p.vx;p.y+=p.vy;clamp();
if(p.y<H/2&&p.vy<0){
p.y=H/2;let gs=diff()*18;
pls.forEach((o,i)=>{o.y-=p.vy;if(o.y>H){pls[i]=gen(-gs,0);sc+=10;sEl.innerText=sc}});
bps.forEach(b=>b.y-=p.vy);fsh.forEach(f=>f.y-=p.vy);
}
for(let i=bps.length-1;i>=0;i--){
let b=bps[i];b.x+=b.vx;b.vy+=.4;b.y+=b.vy;b.rot+=b.vr;
x.save();x.translate(b.x+b.w/2,b.y+b.h/2);x.rotate(b.rot);x.fillStyle='#9ccc65';x.strokeStyle='#1b3009';x.lineWidth=2;x.fillRect(-b.w/2,-b.h/2,b.w,b.h);x.strokeRect(-b.w/2,-b.h/2,b.w,b.h);x.restore();
if(b.y>H+50)bps.splice(i,1);
}
for(let i=fsh.length-1;i>=0;i--){
let f=fsh[i];f.x+=f.vx;if(f.x-f.r<=0||f.x+f.r>=W)f.vx*=-1;dFish(f);
if(p.jt<=0&&Math.hypot(p.x+p.r-f.x,p.y+p.r-f.y)<p.r+f.r-6){die();return}
if(f.y>H+50)fsh.splice(i,1);
}
pls.forEach(o=>{
if(o.t==='m'&&!o.b){o.x+=o.vx;if(o.x<=0||o.x+o.w>=W)o.vx*=-1}
dCroc(o);
if(!o.b&&p.jt<=0&&p.vy>0&&p.x+p.r*1.5>o.x&&p.x+p.r*.5<o.x+o.w&&p.y+p.r*2>=o.y&&p.y+p.r*2<=o.y+o.h+12){
if(o.h){o.h=0;p.jt=150;if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success')}
else{p.vy=p.jp;if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light')}
if(o.t==='s'){o.b=1;bps.push({x:o.x,y:o.y,w:o.w/2,h:o.h,vx:-1.5,vy:1,rot:0,vr:-.05},{x:o.x+o.w/2,y:o.y,w:o.w/2,h:o.h,vx:1.5,vy:1,rot:0,vr:.05})}
}
});
x.save();let cx=p.x+p.r,cy=p.y+p.r;x.beginPath();x.arc(cx,cy,p.r,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=3;x.strokeStyle='#222';x.stroke();
x.fillStyle='#222';x.font='26px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('👽',cx,cy+2);
if(p.jt>0)dHeli(cx,p.y,1);x.restore();
if(p.y>H){die();return}
requestAnimationFrame(loop);
}
function rst(){sc=0;sEl.innerText=0;over=0;goEl.style.display='none';p.x=W/2-25;p.y=H-150;p.vy=0;p.vx=0;p.jt=0;ltx=null;init();loop()}
init();loop();
</script>
</body>
</html>
